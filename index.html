<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Industrial Supervision</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#020617,#111827);color:white;text-align:center}.container{max-width:900px;margin:auto;padding:14px}h1{font-size:38px;margin:18px 0 8px;color:white}.subtitle{color:#d1d5db;font-size:19px;margin-bottom:18px}.card{margin:16px auto;padding:22px;border-radius:26px;background:#1f2937;box-shadow:0 0 20px #0009}.temp{font-size:70px;font-weight:bold;color:#38bdf8}input{padding:14px;font-size:28px;width:170px;height:58px;text-align:center;border-radius:16px;border:none;font-weight:bold}button{width:155px;height:64px;margin:9px;border:none;border-radius:18px;font-size:22px;font-weight:bold;color:white}.start{background:#22c55e}.stop{background:#ef4444}.reset{background:#3b82f6}.emergency{background:#7f1d1d}.setbtn{background:#a855f7;height:72px}.alert{display:none;margin-top:18px;padding:22px;border-radius:20px;background:#7f1d1d;font-size:26px;font-weight:bold;border:3px solid #ef4444}.warnIcon{display:none;font-size:62px;margin-top:12px;animation:blink .6s infinite}@keyframes blink{0%{opacity:1;transform:scale(1)}50%{opacity:.18;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}.monitor{display:flex;justify-content:center;align-items:flex-start;gap:10px;flex-wrap:nowrap}.motorBox{position:relative;width:145px;height:145px;background:#020617;border:2px solid #334155;border-radius:16px;padding:6px;overflow:hidden}.motorTitle{font-size:13px;color:#e5e7eb;margin-bottom:4px;font-weight:bold}.motorImg{width:100%;height:115px;display:block;border-radius:10px;object-fit:contain}.fanOverlay{position:absolute;width:38px;height:38px;border-radius:50%;pointer-events:none}.frontFan{left:53px;top:67px}.blade{position:absolute;width:8px;height:24px;background:#e5e7eb;border-radius:10px;left:15px;top:1px;transform-origin:4px 19px;opacity:.9}.b1{transform:rotate(0deg)}.b2{transform:rotate(120deg)}.b3{transform:rotate(240deg)}.center{position:absolute;width:12px;height:12px;background:#c9a45c;border-radius:50%;left:13px;top:13px;box-shadow:0 0 5px #000}.spin{animation:rot .22s linear infinite}.off{filter:grayscale(1);opacity:.45}@keyframes rot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.lampPanel{display:grid;grid-template-columns:1fr 48px;gap:16px;max-width:360px;margin:22px auto 0;font-size:24px;align-items:center;text-align:left}.lamp{width:34px;height:34px;border-radius:50%;margin:auto;background:#4b5563;box-shadow:inset 0 0 8px #000;border:2px solid #111827}.green{background:#22c55e;box-shadow:0 0 18px #22c55e}.red{background:#ef4444;box-shadow:0 0 18px #ef4444}@media(max-width:650px){h1{font-size:32px}.temp{font-size:64px}.card{padding:20px}button{width:145px}}
</style>
</head>
<body>
<div class="container"><h1>Smart Industrial Supervision</h1><div class="subtitle">Global Firebase Web Panel</div>
<div class="card"><div>Temperature</div><div id="temp" class="temp">-- °C</div><br><span>Max Temp:</span><br><br><input id="limitInput" type="number" step="1"><button class="setbtn" onclick="setLimit()">SET</button><div id="alertBox" class="alert">SYSTEM ALARM</div><div id="warnIcon" class="warnIcon">⚠️</div></div>
<div class="card"><h2>MONITORING</h2><div class="monitor"><div class="motorBox"><div class="motorTitle">Front View</div><img class="motorImg" src="motor_front.jpg" alt="Motor Front"><div id="fanFront" class="fanOverlay frontFan off"><div class="blade b1"></div><div class="blade b2"></div><div class="blade b3"></div><div class="center"></div></div></div><div class="motorBox"><div class="motorTitle">Side View</div><img class="motorImg" src="motor_side.png" alt="Motor Side"></div></div><div class="lampPanel"><div>RUN</div><div id="runLamp" class="lamp"></div><div>EMERGENCY</div><div id="emgLamp" class="lamp"></div><div>ALARM / HIGH TEMP</div><div id="alarmLamp" class="lamp"></div></div></div>
<div class="card"><button class="start" onclick="sendCommand('start')">START</button><button class="stop" onclick="sendCommand('stop')">STOP</button><button class="reset" onclick="sendCommand('reset')">RESET</button><button class="emergency" onclick="sendCommand('emergency')">EMERGENCY</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyB7Xz_JyxOy0SuG7favkXvJM3sviwYjmKA",authDomain:"esp32-motor-control-6bda0.firebaseapp.com",databaseURL:"https://esp32-motor-control-6bda0-default-rtdb.firebaseio.com",projectId:"esp32-motor-control-6bda0",storageBucket:"esp32-motor-control-6bda0.firebasestorage.app",messagingSenderId:"539136431573",appId:"1:539136431573:web:e8b4adbe0993b88062995c"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
window.sendCommand=function(cmd){set(ref(db,"motor/command"),cmd)};
window.setLimit=function(){const v=Number(document.getElementById("limitInput").value);if(v>0&&v<150){set(ref(db,"motor/limit"),v)}};
onValue(ref(db,"motor"),(snapshot)=>{const d=snapshot.val();if(!d)return;const temp=Number(d.temperature??0);const limit=Number(d.limit??70);const motor=Boolean(d.motorState||d.plcMotorRunning);const plcEmergency=Boolean(d.emergencyState||d.plcEmergencyActive);const tempHigh=temp>=limit;const alarm=Boolean(d.plcAlarmActive||plcEmergency||tempHigh);document.getElementById("temp").innerHTML=temp.toFixed(1)+" °C";const input=document.getElementById("limitInput");if(document.activeElement!==input){input.value=limit}document.getElementById("fanFront").className=motor?"fanOverlay frontFan spin":"fanOverlay frontFan off";document.getElementById("runLamp").className=motor?"lamp green":"lamp";document.getElementById("emgLamp").className=plcEmergency?"lamp red":"lamp";document.getElementById("alarmLamp").className=alarm?"lamp red":"lamp";document.getElementById("alertBox").style.display=alarm?"block":"none";document.getElementById("warnIcon").style.display=alarm?"block":"none";if(plcEmergency){document.getElementById("alertBox").innerHTML="PLC EMERGENCY ACTIVE"}else if(tempHigh){document.getElementById("alertBox").innerHTML="HIGH TEMPERATURE"}else if(d.plcAlarmActive){document.getElementById("alertBox").innerHTML="PLC ALARM ACTIVE"}});
</script>
</body>
</html>
