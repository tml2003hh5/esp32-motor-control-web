<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Motor Control</title>

<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#020617,#111827);color:white;text-align:center}
.container{max-width:560px;margin:auto;padding:10px}
.card{margin:16px 10px;padding:22px;border-radius:24px;background:#1f2937;box-shadow:0 0 18px #0009}
.temp{font-size:64px;font-weight:bold;color:#38bdf8}
.status{font-size:24px;margin:10px}
.ok{color:#22c55e}
.danger{color:#ef4444}
input{padding:14px;font-size:28px;width:170px;height:48px;text-align:center;border-radius:15px;border:none;font-weight:bold}
button{width:145px;height:62px;margin:9px;border:none;border-radius:18px;font-size:22px;font-weight:bold;color:white}
.start{background:#22c55e}
.stop{background:#ef4444}
.reset{background:#3b82f6}
.emergency{background:#7f1d1d}
.setbtn{background:#a855f7;height:72px}

.alert{display:none;margin-top:15px;padding:20px;border-radius:18px;background:#7f1d1d;font-size:24px;font-weight:bold;border:3px solid #ef4444}
.warnIcon{display:none;font-size:60px;margin-top:12px;animation:blink .6s infinite}
@keyframes blink{0%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}

.motorBody{width:125px;height:78px;background:linear-gradient(145deg,#64748b,#1e293b);border-radius:20px;margin:25px auto;position:relative}
.motorBody:after{content:"";position:absolute;right:-38px;top:34px;width:38px;height:11px;background:#cbd5e1;border-radius:6px}
.fan{width:68px;height:68px;border-radius:50%;position:absolute;left:28px;top:5px;background:#0f172a;border:5px solid #38bdf8}
.blade{width:12px;height:35px;background:#22c55e;border-radius:12px;position:absolute;left:28px;top:2px;transform-origin:6px 32px}
.b1{transform:rotate(0deg)}
.b2{transform:rotate(120deg)}
.b3{transform:rotate(240deg)}
.center{width:18px;height:18px;background:#e2e8f0;border-radius:50%;position:absolute;left:25px;top:25px}
.spinFan{animation:rot .55s linear infinite}
.offFan{filter:grayscale(1);opacity:.55}
@keyframes rot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>

<body>
<div class="container">
<h1>ESP32 Motor Control</h1>
<p>Global Firebase Web Panel</p>

<div class="card">
  <div>Temperature</div>
  <div id="temp" class="temp">-- °C</div>

  <br>
  <span>Max Temp:</span><br><br>
  <input id="limitInput" type="number" step="1">
  <button class="setbtn" onclick="setLimit()">SET</button>

  <div id="alertBox" class="alert">EMERGENCY HIGH TEMPERATURE</div>
  <div id="warnIcon" class="warnIcon">⚠️</div>
</div>

<div class="card">
  <div class="status">Motor: <span id="motor">--</span></div>
  <div class="status">Emergency: <span id="emergency">--</span></div>

  <div class="motorBody">
    <div id="fan" class="fan offFan">
      <div class="blade b1"></div>
      <div class="blade b2"></div>
      <div class="blade b3"></div>
      <div class="center"></div>
    </div>
  </div>
</div>

<div class="card">
  <button class="start" onclick="sendCommand('start')">START</button>
  <button class="stop" onclick="sendCommand('stop')">STOP</button>
  <button class="reset" onclick="sendCommand('reset')">RESET</button>
  <button class="emergency" onclick="sendCommand('emergency')">EMERGENCY</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7Xz_JyxOy0SuG7favkXvJM3sviwYjmKA",
  authDomain: "esp32-motor-control-6bda0.firebaseapp.com",
  databaseURL: "https://esp32-motor-control-6bda0-default-rtdb.firebaseio.com",
  projectId: "esp32-motor-control-6bda0",
  storageBucket: "esp32-motor-control-6bda0.firebasestorage.app",
  messagingSenderId: "539136431573",
  appId: "1:539136431573:web:e8b4adbe0993b88062995c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendCommand = function(cmd){
  set(ref(db, "motor/command"), cmd);
}

window.setLimit = function(){
  let v = Number(document.getElementById("limitInput").value);
  if(v > 0 && v < 150){
    set(ref(db, "motor/limit"), v);
  }
}

onValue(ref(db, "motor"), (snapshot) => {
  const d = snapshot.val();
  if(!d) return;

  document.getElementById("temp").innerHTML = d.temperature + " °C";

  let input = document.getElementById("limitInput");
  if(document.activeElement !== input){
    input.value = d.limit;
  }

  document.getElementById("motor").innerHTML = d.motorState ? "ON" : "OFF";
  document.getElementById("motor").className = d.motorState ? "ok" : "danger";

  document.getElementById("emergency").innerHTML = d.emergencyState ? "ACTIVE" : "NORMAL";
  document.getElementById("emergency").className = d.emergencyState ? "danger" : "ok";

  document.getElementById("fan").className = d.motorState ? "fan spinFan" : "fan offFan";

  document.getElementById("alertBox").style.display = d.emergencyState ? "block" : "none";
  document.getElementById("warnIcon").style.display = d.emergencyState ? "block" : "none";
});
</script>

</body>
</html>
