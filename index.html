<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Motor Control</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
.container{
  max-width:520px;
  margin:auto;
  padding:15px;
}
.card{
  background:#1e293b;
  margin:15px 0;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 15px #0008;
}
button{
  width:145px;
  height:60px;
  margin:8px;
  border:none;
  border-radius:16px;
  font-size:21px;
  font-weight:bold;
  color:white;
}
.start{background:#22c55e}
.stop{background:#ef4444}
.reset{background:#3b82f6}
.emergency{background:#7f1d1d}

.motorState{
  font-size:42px;
  font-weight:bold;
  margin-top:10px;
}
.on{color:#22c55e}
.off{color:#ef4444}

.alert{
  display:none;
  background:#7f1d1d;
  border:2px solid #ef4444;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
}

.logBox{
  text-align:left;
  background:#0f172a;
  border-radius:14px;
  padding:10px;
  max-height:320px;
  overflow:auto;
}
.logItem{
  border-bottom:1px solid #334155;
  padding:12px;
  font-size:15px;
}
.logType{
  color:#ef4444;
  font-weight:bold;
  font-size:17px;
}
.clearBtn{
  background:#64748b;
  width:170px;
  height:48px;
  font-size:17px;
}
</style>
</head>

<body>

<div class="container">

<h1>ESP32 Motor Control</h1>

<div class="card">
  <h2>Motor State</h2>
  <div id="motorState" class="motorState off">OFF</div>
  <div id="alertBox" class="alert">EMERGENCY ACTIVE</div>
</div>

<div class="card">
  <h2>Control</h2>
  <button class="start" onclick="sendCommand('start')">START</button>
  <button class="stop" onclick="sendCommand('stop')">STOP</button>
  <button class="reset" onclick="sendCommand('reset')">RESET</button>
  <button class="emergency" onclick="sendCommand('emergency')">EMERGENCY</button>
</div>

<div class="card">
  <h2>Emergency Register</h2>
  <div id="logCounter">Total Events: 0</div><br>
  <div id="logBox" class="logBox">Loading...</div>
  <br>
  <button class="clearBtn" onclick="clearLogs()">CLEAR LOGS</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7Xz_JyxOy0SuG7favkXvJM3sviwYjmKA",
  authDomain: "esp32-motor-control-6bda0.firebaseapp.com",
  databaseURL: "https://esp32-motor-control-6bda0-default-rtdb.firebaseio.com",
  projectId: "esp32-motor-control-6bda0",
  storageBucket: "esp32-motor-control-6bda0.firebasestorage.app",
  messagingSenderId: "539136431573",
  appId: "1:539136431573:web:e8b4adbe0993b88062995c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendCommand = function(cmd){
  set(ref(db, "motor/command"), cmd);
};

window.clearLogs = function(){
  if(confirm("Delete all emergency logs?")){
    remove(ref(db, "motor/logs"));
  }
};

onValue(ref(db, "motor"), (snapshot) => {
  const d = snapshot.val();
  if(!d) return;

  const motorRunning = Boolean(d.motorState || d.plcMotorRunning);
  const emergency = Boolean(d.emergencyState || d.plcEmergencyActive);

  const motorDiv = document.getElementById("motorState");

  if(motorRunning){
    motorDiv.innerHTML = "ON";
    motorDiv.className = "motorState on";
  }else{
    motorDiv.innerHTML = "OFF";
    motorDiv.className = "motorState off";
  }

  document.getElementById("alertBox").style.display =
    emergency ? "block" : "none";

  if(d.plcEmergencyActive){
    document.getElementById("alertBox").innerHTML = "PLC EMERGENCY ACTIVE";
  }
  else if(d.emergencyState){
    document.getElementById("alertBox").innerHTML = "WEB / ESP32 EMERGENCY";
  }
});

onValue(ref(db, "motor/logs"), (snapshot) => {
  const logs = snapshot.val();
  const box = document.getElementById("logBox");
  const counter = document.getElementById("logCounter");

  if(!logs){
    counter.innerHTML = "Total Events: 0";
    box.innerHTML = "No emergency events recorded.";
    return;
  }

  const arr = Object.values(logs).sort((a,b)=>{
    return Number(b.timestamp || 0) - Number(a.timestamp || 0);
  });

  counter.innerHTML = "Total Events: " + arr.length;

  box.innerHTML = arr.map(e => {
    let durationText = "--";

    if(e.durationSec !== undefined){
      durationText = e.durationSec + " seconds";
    }
    else if(e.duration !== undefined){
      durationText = e.duration;
    }

    return `
      <div class="logItem">
        <div class="logType">${e.type || "EMERGENCY"}</div>
        Reason: ${e.message || e.reason || e.type || "--"}<br>
        Source: ${e.source || "--"}<br>
        Date: ${e.date || "--"}<br>
        Time: ${e.time || "--"}<br>
        Duration: ${durationText}<br>
        Temperature: ${e.temperature ?? "--"} °C
      </div>
    `;
  }).join("");
});
</script>

</body>
</html>
