<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIS Control | Smart Industrial Supervision</title>
<link rel="icon" type="image/png" href="./sis_logo.png?v=2">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a,#111827);
  color:white;
  text-align:center;
}

.container{
  max-width:620px;
  margin:auto;
  padding:10px;
}

.header{
  margin:18px 10px;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(180deg,#ffffff,#e5e7eb);
  color:#0f172a;
  box-shadow:0 0 22px #0009;
}

.logo{
  width:260px;
  max-width:95%;
  border-radius:18px;
  margin-bottom:8px;
}

.projectTitle{
  font-size:36px;
  font-weight:900;
  letter-spacing:2px;
  color:#082f49;
  margin:8px 0 0;
}

.projectSub{
  font-size:18px;
  color:#0284c7;
  letter-spacing:4px;
  font-weight:bold;
  margin-top:4px;
}

.slogan{
  font-size:14px;
  color:#475569;
  margin-top:12px;
  letter-spacing:2px;
  font-weight:bold;
}

.card{
  margin:16px 10px;
  padding:22px;
  border-radius:24px;
  background:#1f2937;
  box-shadow:0 0 18px #0009;
  border:1px solid #334155;
}

.card h2{
  color:#38bdf8;
  letter-spacing:1px;
}

.temp{
  font-size:64px;
  font-weight:bold;
  color:#38bdf8;
}

input{
  padding:14px;
  font-size:28px;
  width:170px;
  height:48px;
  text-align:center;
  border-radius:15px;
  border:none;
  font-weight:bold;
}

button{
  width:145px;
  height:62px;
  margin:9px;
  border:none;
  border-radius:18px;
  font-size:22px;
  font-weight:bold;
  color:white;
  box-shadow:0 5px 12px #0007;
}

button:active{
  transform:scale(.96);
}

.start{background:#22c55e;}
.stop{background:#ef4444;}
.reset{background:#3b82f6;}
.emergency{background:#7f1d1d;}
.setbtn{background:#a855f7;height:72px;}

.alert{
  display:none;
  margin-top:15px;
  padding:20px;
  border-radius:18px;
  background:#7f1d1d;
  font-size:24px;
  font-weight:bold;
  border:3px solid #ef4444;
}

.warnIcon{
  display:none;
  font-size:60px;
  margin-top:12px;
  animation:blink .6s infinite;
}

@keyframes blink{
  0%{opacity:1;transform:scale(1);}
  50%{opacity:.15;transform:scale(1.25);}
  100%{opacity:1;transform:scale(1);}
}

.monitor{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  background:#000;
  border:2px solid #222;
  border-radius:18px;
  padding:15px;
  margin:10px auto;
  width:fit-content;
}

.motorBox{
  position:relative;
  width:165px;
  height:165px;
  background:#000;
  border-radius:14px;
  overflow:hidden;
}

.motorImg{
  width:100%;
  height:145px;
  display:block;
  border-radius:10px;
  object-fit:contain;
}

.fanOverlay{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  pointer-events:none;
}

.frontFan{
  left:56px;
  top:61px;
}

.blade{
  position:absolute;
  width:10px;
  height:28px;
  background:white;
  border-radius:20px;
  left:21px;
  top:1px;
  transform-origin:5px 25px;
  opacity:.95;
}

.b1{transform:rotate(0deg);}
.b2{transform:rotate(120deg);}
.b3{transform:rotate(240deg);}

.center{
  position:absolute;
  width:16px;
  height:16px;
  background:#c9a45c;
  border-radius:50%;
  left:18px;
  top:18px;
  box-shadow:0 0 5px #000;
}

.spinFan{animation:rot .20s linear infinite;}
.offFan{filter:grayscale(1);opacity:.45;}

@keyframes rot{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.lampPanel{
  display:grid;
  grid-template-columns:1fr 48px;
  gap:14px;
  max-width:360px;
  margin:22px auto 0;
  font-size:22px;
  align-items:center;
  text-align:left;
}

.lamp{
  width:32px;
  height:32px;
  border-radius:50%;
  margin:auto;
  background:#4b5563;
  box-shadow:inset 0 0 8px #000;
  border:2px solid #111827;
}

.green{
  background:#22c55e;
  box-shadow:0 0 18px #22c55e;
}

.red{
  background:#ef4444;
  box-shadow:0 0 18px #ef4444;
}

.logBox{
  text-align:left;
  max-height:300px;
  overflow:auto;
  background:#111827;
  border-radius:14px;
  padding:10px;
}

.logItem{
  padding:10px;
  border-bottom:1px solid #374151;
  font-size:15px;
  line-height:1.5;
}

.logType{
  color:#ef4444;
  font-weight:bold;
  font-size:17px;
}

.clearBtn{
  background:#6b7280;
  width:180px;
  height:48px;
  font-size:18px;
}

.footer{
  margin:20px 0 10px;
  color:#94a3b8;
  font-size:13px;
  letter-spacing:1px;
}

/* تصميم مضغوط للهاتف */
@media(max-width:450px){

  .container{
    max-width:100%;
    padding:6px;
  }

  .header{
    margin:8px 6px;
    padding:12px;
    border-radius:22px;
  }

  .logo{
    width:210px;
    max-width:90%;
    margin-bottom:2px;
  }

  .projectTitle{
    font-size:26px;
    margin:2px 0 0;
    letter-spacing:1px;
  }

  .projectSub{
    font-size:12px;
    letter-spacing:3px;
    margin-top:2px;
  }

  .slogan{
    font-size:11px;
    margin-top:6px;
    letter-spacing:1px;
  }

  .card{
    margin:9px 6px;
    padding:14px;
    border-radius:20px;
  }

  .card h2{
    margin:4px 0 12px;
    font-size:23px;
  }

  .temp{
    font-size:52px;
  }

  input{
    width:120px;
    height:42px;
    font-size:24px;
    padding:10px;
  }

  .setbtn{
    width:120px;
    height:62px;
    font-size:20px;
  }

  button{
    width:128px;
    height:54px;
    margin:6px;
    font-size:19px;
    border-radius:15px;
  }

  .monitor{
    gap:6px;
    padding:8px;
    margin:6px auto;
  }

  .motorBox{
    width:135px;
    height:135px;
  }

  .motorImg{
    height:120px;
  }

  .frontFan{
    left:46px;
    top:55px;
    width:44px;
    height:44px;
  }

  .blade{
    width:8px;
    height:24px;
    left:18px;
    top:1px;
    transform-origin:4px 21px;
  }

  .center{
    width:14px;
    height:14px;
    left:15px;
    top:15px;
  }

  .lampPanel{
    margin:14px auto 0;
    font-size:18px;
    gap:9px;
    max-width:310px;
  }

  .lamp{
    width:26px;
    height:26px;
  }

  .alert{
    padding:12px;
    font-size:19px;
    margin-top:10px;
  }

  .warnIcon{
    font-size:42px;
    margin-top:5px;
  }

  .logBox{
    max-height:220px;
  }

  .logItem{
    font-size:13px;
    padding:8px;
  }

  .clearBtn{
    width:150px;
    height:44px;
    font-size:16px;
  }

  .footer{
    margin:10px 0 5px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <img class="logo" src="./sis_header_logo.png?v=2" alt="SIS Control Logo">
  <div class="projectTitle">SIS Control</div>
  <div class="projectSub">SMART INDUSTRIAL SUPERVISION</div>
  <div class="slogan">MONITOR • CONTROL • PROTECT</div>
</div>

<div class="card">
  <div>Temperature</div>
  <div id="temp" class="temp">-- °C</div>
  <br>

  <span>Max Temp:</span><br><br>
  <input id="limitInput" type="number" step="1">
  <button class="setbtn" onclick="setLimit()">SET</button>

  <div id="alertBox" class="alert">SYSTEM ALARM</div>
  <div id="warnIcon" class="warnIcon">⚠️</div>
</div>

<div class="card">
  <h2>MONITORING</h2>

  <div class="monitor">
    <div class="motorBox">
      <img class="motorImg" src="./motor_front.jpg">

      <div id="fanFront" class="fanOverlay frontFan offFan">
        <div class="blade b1"></div>
        <div class="blade b2"></div>
        <div class="blade b3"></div>
        <div class="center"></div>
      </div>
    </div>

    <div class="motorBox">
      <img class="motorImg" src="./motor_side.png">
    </div>
  </div>

  <div class="lampPanel">
    <div>RUN</div><div id="runLamp" class="lamp"></div>
    <div>EMERGENCY</div><div id="emgLamp" class="lamp"></div>
    <div>ALARM / HIGH TEMP</div><div id="alarmLamp" class="lamp"></div>
  </div>
</div>

<div class="card">
  <h2>CONTROL</h2>
  <button class="start" onclick="sendCommand('start')">START</button>
  <button class="stop" onclick="sendCommand('stop')">STOP</button>
  <button class="reset" onclick="sendCommand('reset')">RESET</button>
  <button class="emergency" onclick="sendCommand('emergency')">EMERGENCY</button>
</div>

<div class="card">
  <h2>Emergency Register</h2>
  <div id="logCounter">Total Events: 0</div><br>
  <div id="logBox" class="logBox">Loading...</div>
  <br>
  <button class="clearBtn" onclick="clearLogs()">CLEAR LOGS</button>
</div>

<div class="footer">
  SIS Control © Smart Industrial Supervision
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7Xz_JyxOy0SuG7favkXvJM3sviwYjmKA",
  authDomain: "esp32-motor-control-6bda0.firebaseapp.com",
  databaseURL: "https://esp32-motor-control-6bda0-default-rtdb.firebaseio.com",
  projectId: "esp32-motor-control-6bda0",
  storageBucket: "esp32-motor-control-6bda0.firebasestorage.app",
  messagingSenderId: "539136431573",
  appId: "1:539136431573:web:e8b4adbe0993b88062995c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendCommand = function(cmd){
  set(ref(db, "motor/command"), cmd);
};

window.setLimit = function(){
  let v = Number(document.getElementById("limitInput").value);

  if(v > 0 && v < 150){
    set(ref(db, "motor/limit"), v);
  }else{
    alert("Enter temperature between 1 and 149");
  }
};

window.clearLogs = function(){
  if(confirm("Delete all emergency logs?")){
    remove(ref(db, "motor/logs"));
  }
};

onValue(ref(db, "motor"), (snapshot) => {
  const d = snapshot.val();
  if(!d) return;

  const temp = Number(d.temperature ?? 0);
  const limit = Number(d.limit ?? 70);

  const motor = Boolean(d.finalRun || d.motorState || d.plcMotorRunning);
  const emergency = Boolean(d.finalEmergency || d.emergencyState || d.plcEmergencyActive);
  const tempHigh = Boolean(d.highTemperature || temp >= limit);
  const alarm = Boolean(emergency || tempHigh);

  document.getElementById("temp").innerHTML = temp.toFixed(1) + " °C";

  let input = document.getElementById("limitInput");
  if(document.activeElement !== input){
    input.value = limit;
  }

  document.getElementById("fanFront").className =
    motor ? "fanOverlay frontFan spinFan" : "fanOverlay frontFan offFan";

  document.getElementById("runLamp").className =
    motor ? "lamp green" : "lamp";

  document.getElementById("emgLamp").className =
    emergency ? "lamp red" : "lamp";

  document.getElementById("alarmLamp").className =
    alarm ? "lamp red" : "lamp";

  document.getElementById("alertBox").style.display =
    alarm ? "block" : "none";

  document.getElementById("warnIcon").style.display =
    alarm ? "block" : "none";

  if(d.plcEmergencyActive){
    document.getElementById("alertBox").innerHTML = "PLC EMERGENCY ACTIVE";
  }
  else if(d.emergencyState){
    document.getElementById("alertBox").innerHTML = "WEB / ESP32 EMERGENCY";
  }
  else if(tempHigh){
    document.getElementById("alertBox").innerHTML = "HIGH TEMPERATURE";
  }
});

onValue(ref(db, "motor/logs"), (snapshot) => {
  const logs = snapshot.val();
  const box = document.getElementById("logBox");
  const counter = document.getElementById("logCounter");

  if(!logs){
    counter.innerHTML = "Total Events: 0";
    box.innerHTML = "No emergency events recorded.";
    return;
  }

  const arr = Object.values(logs).sort((a,b)=>{
    return Number(b.timestamp || 0) - Number(a.timestamp || 0);
  });

  counter.innerHTML = "Total Events: " + arr.length;

  box.innerHTML = arr.map(e => {
    let duration = "--";

    if(e.durationSec !== undefined){
      duration = e.durationSec + " sec";
    }

    return `
      <div class="logItem">
        <div class="logType">${e.type || "EMERGENCY"}</div>
        Reason: ${e.reason || "--"}<br>
        Source: ${e.source || "--"}<br>
        Date: ${e.date || "--"}<br>
        Time: ${e.time || "--"}<br>
        Duration: ${duration}<br>
        Temperature: ${e.temperature ?? "--"} °C<br>
        Limit: ${e.limit ?? "--"} °C
      </div>
    `;
  }).join("");
});
</script>

</body>
</html>
